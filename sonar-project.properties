# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-maven-plugin
# Analysed by the sonar job of .github/workflows/ci.yml (paxel/gates sonar.yml) on pull requests
# and on summer; Automatic Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-maven-plugin
sonar.projectName=sanshain-maven-plugin

# The plugin, its POM and the workflows; the tests and the fuzz targets are in src/test/java.
sonar.sources=src/main/java,pom.xml,.github
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8
sonar.java.source=11

# The shared Java gate builds with Maven and keeps the compiled classes, which SonarQube Cloud
# asks for, and the JaCoCo report of the tests; the sonar job downloads them.
sonar.java.binaries=coverage/java.classes
sonar.java.test.binaries=coverage/java.test-classes
sonar.coverage.jacoco.xmlReportPaths=coverage/java.jacoco.xml
