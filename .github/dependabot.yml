# Dependency updates: one grouped pull request per ecosystem and week.
# A release is proposed only after it has been out for 14 days (cooldown),
# so early fixes are in; security updates are not held back.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      githubactions:
        patterns: ["*"]
