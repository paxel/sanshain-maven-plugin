name: CI

# sanshain-maven-plugin's gates. The standard's part comes from paxel/gates: the OSV gate, the
# Java gate (Error Prone, SpotBugs, tests, coverage ratchet) and SonarQube Cloud. The job on
# the oldest supported Java is the repository's own (docs/adr/0001-move-to-gates.md).
# A branch gets its run through its pull request; a run per push as well would be the same
# jobs twice, and SonarQube Cloud analyses only the default branch and pull requests.
on:
  push:
    branches: [summer]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Known vulnerabilities and licences of every dependency: osv-scanner decided by gates'
  # osv_gate.py. What is accepted stands in osv-scanner.toml.
  vulns:
    uses: paxel/gates/.github/workflows/vulns.yml@66ed2d3a448a5f6bfa1794809b330eb9fbee01ba # v1.2.0

  # On the JDK .java-version pins.
  java:
    uses: paxel/gates/.github/workflows/java.yml@66ed2d3a448a5f6bfa1794809b330eb9fbee01ba # v1.2.0

  # The plugin promises Java 11 (requiredJavaVersion in plugin.xml, PluginDescriptorTest), so
  # the tests run there, not just the compiler's --release 11. Error Prone and SpotBugs cannot
  # run on JDK 11; the profile jdk11 of pom.xml leaves those two out and nothing else.
  oldest:
    name: Oldest Java (11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Tests
        run: mvn --batch-mode --no-transfer-progress -Pjdk11 verify

  sonar:
    needs: java
    uses: paxel/gates/.github/workflows/sonar.yml@66ed2d3a448a5f6bfa1794809b330eb9fbee01ba # v1.2.0
    secrets:
      sonar-token: ${{ secrets.SQ_TOKEN }}
