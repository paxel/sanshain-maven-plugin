# Release on tag: `git tag v2.5.1 && git push github v2.5.1` produces everything.
#
#   version         - the tag names the version pom.xml carries
#   gate            - paxel/gates release-gate.yml: no open alert or SonarQube Cloud finding
#                     that is not accepted, no known vulnerability, no licence outside the
#                     allowlist, and a CHANGELOG section for the version
#   build           - the strict build with its tests on the tagged commit, then the plugin
#                     jar, the sources jar, the javadoc jar and the POM, built once
#   provenance      - paxel/gates provenance.yml: a CycloneDX SBOM of the source, signed build
#                     provenance for every file and its Sigstore bundle as a file of its own
#   release         - GitHub Release, notes = the CHANGELOG section for the tag, with every
#                     file of the jobs before
#   publish-central - Maven Central, only when the jars it is about to deploy are byte for
#                     byte the attested files
#
# One-time setup:
#   environment `central` with the secrets OSSRH_USERNAME and OSSRH_TOKEN (a user token of
#     central.sonatype.com), GPG_PRIVATE_KEY and GPG_PASSPHRASE (the key Maven Central knows)
#   repository secret GATES_ALERTS_TOKEN - read access to the repository's alerts, for the
#     release gate
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: the job that writes the GitHub Release widens this itself.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The mistake a hand-cut tag makes: tagging v2.5.1 without bumping the POM. Maven
      # Central publishes what pom.xml says, so the tag would name a version nobody can use.
      - name: Tag matches the POM version
        run: |
          ver=$(python3 -c 'import xml.etree.ElementTree as tree; print(tree.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version"))')
          tag=${GITHUB_REF_NAME#v}
          [ "$ver" = "$tag" ] || { echo "::error::tag v$tag != POM version $ver" >&2; exit 1; }
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  gate:
    needs: version
    uses: paxel/gates/.github/workflows/release-gate.yml@66ed2d3a448a5f6bfa1794809b330eb9fbee01ba # v1.2.0
    permissions:
      contents: read
      security-events: read
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      alerts-token: ${{ secrets.GATES_ALERTS_TOKEN }}

  build:
    name: Jars
    needs: [version, gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The JDK .java-version pins, the one CI tested with.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      # The shared gate runs no tests. A tag can sit on any commit, and a version on Maven
      # Central cannot be replaced, so the tagged commit goes through the strict build with
      # its tests here once more before anything is published from it.
      - name: Error Prone, SpotBugs, tests, then the jars
        run: mvn --batch-mode --no-transfer-progress verify
      # Built once: these files are attested and attached to the GitHub Release. The POM is
      # the file Maven Central holds as sanshain-maven-plugin-<version>.pom.
      - name: The release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp "target/sanshain-maven-plugin-${VERSION}.jar" \
             "target/sanshain-maven-plugin-${VERSION}-sources.jar" \
             "target/sanshain-maven-plugin-${VERSION}-javadoc.jar" dist/
          cp pom.xml "dist/sanshain-maven-plugin-${VERSION}.pom"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-jars
          path: dist/*
          if-no-files-found: error

  provenance:
    needs: build
    uses: paxel/gates/.github/workflows/provenance.yml@66ed2d3a448a5f6bfa1794809b330eb9fbee01ba # v1.2.0
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      name: sanshain-maven-plugin
      tag: ${{ github.ref_name }}
      artifacts: dist-*

  release:
    name: GitHub Release
    needs: [version, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The jars and the POM, with the SBOM and the Sigstore bundle beside them:
      # `gh attestation verify <file> -R paxel/sanshain-maven-plugin` checks a download, with
      # `--bundle <the sigstore file>` offline.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Release notes from the CHANGELOG section
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
      # softprops updates an existing release rather than failing on it, so a re-run for
      # the same tag is safe.
      - name: Create or update the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true

  publish-central:
    name: Maven Central
    needs: [version, release]
    environment: central
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: attested
      - name: Publish to Maven Central (skipping a version already there)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # A version on Maven Central is immutable: deploying it again is a hard error, so a
          # re-run after a publish must skip what already landed.
          if curl -fsSL --proto '=https' -o /dev/null \
               "https://repo1.maven.org/maven2/io/github/paxel/sanshain/sanshain-maven-plugin/${VERSION}/sanshain-maven-plugin-${VERSION}.pom"; then
            echo "sanshain-maven-plugin ${VERSION} already on Maven Central, skipping"
            exit 0
          fi
          # Maven cannot deploy files it did not build itself. The build is reproducible
          # (project.build.outputTimestamp in pom.xml), so what it is about to deploy is built
          # first and compared with the attested files: a difference stops the deploy. The
          # tests and SpotBugs ran in the build job and change no file of the jars.
          mvn --batch-mode --no-transfer-progress -DskipTests -Dspotbugs.skip=true package
          for file in "sanshain-maven-plugin-${VERSION}.jar" \
                      "sanshain-maven-plugin-${VERSION}-sources.jar" \
                      "sanshain-maven-plugin-${VERSION}-javadoc.jar"; do
            cmp "target/$file" "attested/$file" || {
              echo "::error::$file differs from the attested release file" >&2
              exit 1
            }
          done
          cmp pom.xml "attested/sanshain-maven-plugin-${VERSION}.pom" || {
            echo "::error::pom.xml differs from the attested release file" >&2
            exit 1
          }
          # The release profile signs with GPG and uploads through the Central Portal.
          mvn --batch-mode --no-transfer-progress -DskipTests -Dspotbugs.skip=true -Prelease deploy
