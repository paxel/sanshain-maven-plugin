# The coverage ratchet (paxel/gates coverage_ratchet.py): one part per measured module. CI
# writes coverage/java.lcov and fails below the floor. After a rise, run the commands AGENTS.md
# names; the ratchet raises the floor to the measured value minus 0.1 and writes
# .github/badges/coverage-java.json. Commit both with the change that earned them.

[[parts]]
name = "java"
lcov = "coverage/java.lcov"
floor = 91.32
