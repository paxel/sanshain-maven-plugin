reason = """The JSR 250 annotations are under CDDL-1.0, a weak copyleft licence that covers \
changes to the annotations themselves. They come with Eclipse Sisu, are provided by the \
user's Maven (maven-plugin-api 3.6.3) and never shipped with the plugin."""

